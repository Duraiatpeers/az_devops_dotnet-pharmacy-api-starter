trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: BuildAndTest
  jobs:
  - job: Build
    steps:
    - task: UseDotNet@2
      inputs:
        version: '8.0.x'
    - script: dotnet restore
      displayName: 'Restore'
    - script: dotnet build --configuration Release --no-restore
      displayName: 'Build'
    - script: dotnet test --configuration Release --no-build
      displayName: 'Test'