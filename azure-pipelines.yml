trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: BuildAndTest
  jobs:
  - job: Build
    steps:
    - task: UseDotNet@2
      inputs:
        version: '8.0.x'
    - script: dotnet restore
      displayName: 'Restore'
    - script: dotnet build --configuration Release --no-restore
      displayName: 'Build'
    - script: dotnet test --configuration Release --no-build
      displayName: 'Test'

- stage: SecretScan
  dependsOn: BuildAndTest
  jobs:
  - job: ScanForSecrets
    steps:
    - script: |
        docker run --rm -v $(Build.SourcesDirectory):/repo \
          zricethezav/gitleaks:latest detect \
          --source="/repo" --no-git -v --exit-code 1
      displayName: 'Gitleaks secret scan'

- stage: Provision
  dependsOn: SecretScan
  jobs:
  - job: ProvisionInfrastructure
    steps:
    - task: AzureCLI@2
      displayName: 'What-if preview'
      inputs:
        azureSubscription: 'arm-pharmacyapi-demo-dev'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az deployment group what-if \
            --resource-group rg-durai \
            --template-file infra/main.bicep \
            --parameters infra/dev.bicepparam
    - task: AzureCLI@2
      displayName: 'Apply'
      inputs:
        azureSubscription: 'arm-pharmacyapi-demo-dev'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az deployment group create \
            --resource-group rg-durai \
            --template-file infra/main.bicep \
            --parameters infra/dev.bicepparam

- stage: Deploy
  dependsOn: Provision
  jobs:
  - job: DeployApp
    steps:
    - task: UseDotNet@2
      inputs:
        version: '8.0.x'
    - script: dotnet publish PharmacyApi.Demo/PharmacyApi.Demo.csproj -c Release -o $(Build.ArtifactStagingDirectory)
      displayName: 'Publish'
    - task: AzureWebApp@1
      inputs:
        azureSubscription: 'arm-pharmacyapi-demo-dev'
        appName: 'app-pharmacyapi-demo-dev'
        package: '$(Build.ArtifactStagingDirectory)'